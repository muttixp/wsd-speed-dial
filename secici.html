<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>WSD Speed Dial</title>
<link rel="stylesheet" href="css/wsd.css">
<style>
    /* Sag tik "Klasor sec..." penceresi (1.5.2). Ana sayfanin duvar
       kagidi/serit duzeni yok; yalnizca agac + arama. */
    html, body { height: 100%; }
    body { background: #1c1f26; overflow: hidden; display: flex; flex-direction: column; padding: 14px; box-sizing: border-box; gap: 10px; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    #secAdres { margin: -4px 0 0; font-size: 11.5px; color: var(--metin-sonuk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #secSuz { width: 100%; box-sizing: border-box; }
    #secListe { flex: 1; max-height: none; margin: 0; }
    #secListe li .tasiAd { flex: 1; }
    #secListe li:hover .tasiAd { text-decoration: underline; text-underline-offset: 3px; }
    /* Ok genis tiklama alani: ada tiklamak EKLER, yanlislikla eklenmesin */
    #secListe .tasiOk { width: 22px; height: 22px; line-height: 22px; border-radius: 4px; font-size: 12px; }
    #secListe li.dalli .tasiOk:hover { background: rgba(255,255,255,.12); }
    .secAlt { display: flex; justify-content: flex-end; gap: 8px; }
    .secIpucu { font-size: 11px; color: var(--metin-sonuk); margin-right: auto; align-self: center; }
</style>
</head>
<body>
    <h1 data-c="klasorSec">Klasör seç</h1>
    <p id="secAdres"></p>
    <input type="text" id="secSuz" class="yonetSuz" placeholder="Ara..." data-c-placeholder="grupAra" autocomplete="off" spellcheck="false">
    <ul id="secListe" class="tasiListe"></ul>
    <div class="secAlt">
        <span class="secIpucu" data-c="klasorSecIpucu">Ada tıklayınca eklenir, ▸ açar</span>
        <button id="secIptal" class="dugme" data-c="vazgec">Vazgeç</button>
    </div>
    <script type="module" src="js/secici.js"></script>
</body>
</html>
